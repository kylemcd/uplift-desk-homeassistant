name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Pack HACS integration
        run: |
          cd custom_components/uplift_desk
          zip -r ../../../uplift_desk.zip . -x '__pycache__/*' '*.pyc'
          cd ../../..
          sha256sum uplift_desk.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            uplift_desk.zip
            SHA256SUMS
